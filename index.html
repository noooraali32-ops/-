<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana's Museum 🌸</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#000000,#1b001b);
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.card{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.2);
    border-radius:25px;
    padding:40px;
    text-align:center;
    animation:fade 1.5s;
}

h1{
    color:#ff8fd8;
    font-size:40px;
    margin-bottom:20px;
}

h2{
    color:white;
    margin-bottom:15px;
}

p{
    line-height:1.9;
    color:#f2f2f2;
}

button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4fa8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

@keyframes fade{
from{opacity:0;transform:translateY(40px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">

<h1>🌸 Hana's Museum 🌸</h1>

<h2>Welcome Hana 💖</h2>

<p>
أهلاً بيكي...<br><br>

دي مش مجرد تهنئة.<br>
دي رحلة صغيرة اتعملت مخصوص علشان تحتفل بنجاحك
وتفكرك بأجمل لحظات السنة. ✨
</p>

<button onclick="alert('🚪 الباب هيفتح في المرحلة الجاية')">
ابدئي الرحلة 🌷
</button>

</div>

</body>
</html>
