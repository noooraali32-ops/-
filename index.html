<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رحلة تانية ثانوي 🎓</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#c9d6ff,#e2e2e2);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    background:white;
    width:90%;
    max-width:700px;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#6a4cff;
    margin-bottom:20px;
}

p{
    font-size:20px;
    line-height:1.8;
    color:#333;
}

button{
    margin-top:30px;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:#6a4cff;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h1>🏛️ متحف رحلة تانية ثانوي</h1>

<p>
أهلاً بيكي...<br><br>

دي مش مجرد رسالة تهنئة.<br>
دي رحلة صغيرة هتمري فيها على أهم محطات السنة،
لحد ما توصلي للنهاية. 🌸
</p>

<button onclick="alert('أول قاعة لسه بنبنيها 😉')">
ابدئي الرحلة
</button>

</div>

</body>
</html>
